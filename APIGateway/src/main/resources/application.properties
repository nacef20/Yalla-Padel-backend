spring.application.name=api-gateway
server.port=8081

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Activer discovery automatique
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true 


# Preferred namespace in recent Spring Cloud versions
spring.cloud.gateway.server.webmvc.routes[0].id=reclamation-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://reclamationreponsemicroservice
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/complaints,/complaints/**