server:
  port: 8880

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ilyesdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/jungleinenglish-realm
          jwk-set-uri: http://localhost:8085/realms/jungleinenglish-realm/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# URL of the user-service (Keycloak proxy)
user-service:
  url: http://localhost:2020
